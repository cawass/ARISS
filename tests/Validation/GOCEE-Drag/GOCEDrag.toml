#
#        ARISS - Atmospheric Refueling Iterative System Solver
# ============================================================================== #
#  Description:
#      GOCE drag reference case for Fig. 5 recreation in GOCEE-Drag.
#      Geometry follows the paper condition A_parallel / A_ref = 28.2 with
#      GOCE body length L = 5.26 m.
#
#  Project:        ARISS
#  Module:         GOCEDrag.toml
# ============================================================================== #

name = "GOCE Drag Reference"

[orbit]
altitude = 250.0
alpha = 0.0
msis_date = "2007-01-01T12:00:00"
msis_f107 = 140.0
msis_ap = 15.0
use_average = true

[geometry]
S_in = "c"
S_body = "c"
use_intake_area_ratio = true
fixed_body = true
AR_in = 1.0
AR_body = 1.0
AR_solar = 1.0
AR_rad = 1.0

# Circular cross section with d = 4L/28.2 at L=5.26 m -> A = pi d^2 / 4
A_body = 0.4372030023764446
A_in = 0.4372030023764446
A_ref = 0.4372030023764446
A_prop = 0.0
A_in_drag = 0.4372030023764446
A_solar = 0.0
A_rad = 0.0
L_in = 0.0
L_body = 5.26
t_solar = 0.0
t_rad = 0.0

# Paper assumes fully accommodated diffuse reflection for this comparison
epsilon_body = 0.0
epsilon_in = 0.0
epsilon_in_norm = 0.0
epsilon_solar = 0.0
epsilon_rad = 0.0

[thermal]
T_des = 300.0

[mission_profile]
active_refueling = false
