#
#        ARISS - Atmospheric Refueling Iterative System Solver
# ============================================================================== #
#  Description:
#      Solver-level EULO reference case derived from Gunaltay et al. (IEPC 2025).
#
#  Project:        ARISS
#  Module:         IEPC2025Paper.toml
# ============================================================================== #

name = "IEPC 2025 Paper | EULO"

[orbit]
altitude = 240.0
msis_date = "2000-01-01T12:00:00"
msis_f107 = 140.0
msis_ap = 15.0
alpha = 0.0                   # Use 0.001 only if your RTP/shadowing implementation is singular at 0 deg AoA.

[geometry]
S_in = "c"
S_body = "c"
use_intake_area_ratio = true
intake_area_ratio = 0.5826    # = A_in / A_body = 1.2217 / 2.0970
fixed_body = true
AR_in = 1.0                   # Assumption; paper does not publish intake aspect ratio.
AR_body = 1.0                 # Assumption / solver abstraction.
AR_solar = 5.0                # Assumption / solver abstraction.
A_in = 1.2217                 # 3 x intake area for 72 cm diameter intakes
A_body = 2.0970               # Regular nonagon frontal area with 1.6 m inscribed-circle diameter
A_solar = 11.0000             # Assumption; paper does not publish a single solver-ready total projected area
A_rad = 0.0                   # Not specified in paper
L_in = 1.0                    # Intake system occupies about 1 m length
L_body = 2.0                  # Kept as modelling assumption; paper gives ~3 m total height, not a body-only length
wake_in = 1.0                 # Assumption / solver abstraction
wake_body = 1.0               # Assumption / solver abstraction
wake_solar = 1.0              # Assumption / solver abstraction
wake_radiator = 1.0           # Assumption / solver abstraction

X_solar = 0.5                     # [m] Solar panel axial center from thruster-side butt.

[thruster]
specific_impulse = 5455.0     # Not given in this paper; keep only if you intentionally inherit the RIT-10 assumption set
eff = 0.53                    # Not given in this paper
power = 2000.0                # Total DC power for the three thrusters

[mass]
Mass_total = 550.0

[power]
Power_ADCS = 0.0              # Not published in paper
Power_payload = 0.0           # Not published in paper
Power_refprop = 0.0           # Not published in paper

[solar]
av_aligment = 0.0
eta_solar = 0.32
eta_power = 0.95              # Not given in paper; keep as solver assumption

[refueling]
coll_eff = 0.35

[mission_profile]
active_refueling = false